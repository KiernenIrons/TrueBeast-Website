# Fly.io config for TrueBeast Beast Bot
# Deploy with: fly deploy (from the discord-bot/ directory)
# Secrets:     fly secrets set DISCORD_BOT_TOKEN=... SUPPORT_CHANNEL_ID=... etc.

app = 'truebeast-beast-bot'
primary_region = 'ord'

[build]

[env]
  NODE_ENV = 'production'

# HTTP is only the recorder's download API (recorder.js), used by truebeast.io/rec/<id>.
# The bot itself still runs continuously via WebSocket.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# Voice recordings + finished exports (recorder.js). Kept across deploys so recordings
# survive restarts; they expire 7 days after they end.
[[mounts]]
  source = 'recordings'
  destination = '/data'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  # Give the bot 30s to flush voice data to Firestore before SIGKILL
  kill_timeout = '30s'
  # Headless bot must always stay running — never auto-stop
  auto_stop_machines = 'off'
  min_machines_running = 1
